name: company-brain
services:
  falkordb:
    image: falkordb/falkordb:v4.22.0
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - falkordb_data:/data
    command: ["redis-server", "--loadmodule", "/FalkorDB/bin/src/falkordb.so", "--appendonly", "yes", "--dir", "/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  falkordb_data:
